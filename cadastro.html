<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registro de Vendas de Coca</title>
  <script>
    const vendas = {};

    function registrarVenda() {
      const nome = document.getElementById("nome").value.trim();
      const quantidade = parseInt(document.getElementById("quantidade").value);
      const valorPago = parseFloat(document.getElementById("valorPago").value);

      if (!nome || isNaN(quantidade) || isNaN(valorPago)) {
        alert("Preencha todos os campos corretamente.");
        return;
      }

      if (!vendas[nome]) {
        vendas[nome] = {
          totalQuantidade: 0,
          totalValor: 0
        };
      }

      vendas[nome].totalQuantidade += quantidade;
      vendas[nome].totalValor += valorPago;

      atualizarResumo();
      limparCampos();
    }

    function atualizarResumo() {
      let html = "<h3>Resumo das Vendas</h3>";
      let totalGeral = 0;

      for (const nome in vendas) {
        const dados = vendas[nome];
        html += `
          <p><strong>${nome}</strong>:<br>
          Quantidade total: ${dados.totalQuantidade}<br>
          Valor total pago: R$ ${dados.totalValor.toFixed(2)}</p>
        `;
        totalGeral += dados.totalValor;
      }

      html += `<hr><strong>Total geral arrecadado:</strong> R$ ${totalGeral.toFixed(2)}`;
      document.getElementById("resumo").innerHTML = html;
    }

    function limparCampos() {
      document.getElementById("nome").value = "";
      document.getElementById("quantidade").value = "";
      document.getElementById("valorPago").value = "";
    }
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 20px;
      max-width: 500px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label, input {
      display: block;
      width: 100%;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #ff0000;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    #resumo {
      margin-top: 30px;
      background: #e0ffe0;
      padding: 15px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Registro de Vendas de Coca</h2>

    <label for="nome">Nome da pessoa:</label>
    <input type="text" id="nome" required>

    <label for="quantidade">Quantidade vendida:</label>
    <input type="number" id="quantidade" min="1" required>

    <label for="valorPago">Valor total pago (R$):</label>
    <input type="number" id="valorPago" step="0.01" min="0" required>

    <button onclick="registrarVenda()">Registrar Venda</button>

    <div id="resumo"></div>
  </div>
</body>
</html>
